        const SUPPORTED_LANGS = ['en', 'zh-CN', 'zh-TW', 'es', 'ja', 'ko'];

        function getURLParamValue(key) {
            const fromSearch = new URLSearchParams(window.location.search).get(key);
            if (fromSearch) return fromSearch;

            const hash = window.location.hash || '';
            const hashQueryIndex = hash.indexOf('?');
            if (hashQueryIndex >= 0) {
                const hashQuery = hash.slice(hashQueryIndex + 1);
                const fromHashQuery = new URLSearchParams(hashQuery).get(key);
                if (fromHashQuery) return fromHashQuery;
            }
            return null;
        }

        function normalizeLanguage(rawLang) {
            if (!rawLang || typeof rawLang !== 'string') return null;
            const value = decodeURIComponent(rawLang).trim().replace(/_/g, '-').toLowerCase();

            if (value === 'zh' || value === 'zh-cn' || value === 'zh-hans') return 'zh-CN';
            if (value === 'zh-tw' || value === 'zh-hk' || value === 'zh-hant') return 'zh-TW';
            if (value === 'en' || value === 'en-us' || value === 'en-gb') return 'en';
            if (value === 'ja' || value === 'ja-jp') return 'ja';
            if (value === 'ko' || value === 'ko-kr') return 'ko';
            if (value === 'es' || value === 'es-es' || value === 'es-419') return 'es';

            return SUPPORTED_LANGS.includes(rawLang) ? rawLang : null;
        }

        function normalizeTheme(rawTheme) {
            if (!rawTheme || typeof rawTheme !== 'string') return null;
            const value = decodeURIComponent(rawTheme).trim().toLowerCase();
            if (value === 'dark') return 'dark';
            if (value === 'light') return 'light';
            if (value === 'auto' || value === 'system' || value === 'follow-system') {
                return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            return null;
        }

        // 从URL获取语言参数
        function getLangFromURL() {
            return normalizeLanguage(getURLParamValue('lang'));
        }

        // 从URL获取主题参数
        function getThemeFromURL() {
            return normalizeTheme(getURLParamValue('theme'));
        }

        // 检测浏览器语言
        function detectBrowserLanguage() {
            const browserLang = navigator.language || navigator.userLanguage;
            if (SUPPORTED_LANGS.includes(browserLang)) {
                return browserLang;
            }

            const langPrefix = browserLang.split('-')[0];
            if (langPrefix === 'zh') {
                return browserLang.includes('TW') || browserLang.includes('HK') ? 'zh-TW' : 'zh-CN';
            } else if (langPrefix === 'ja') {
                return 'ja';
            } else if (langPrefix === 'ko') {
                return 'ko';
            } else if (langPrefix === 'es') {
                return 'es';
            } else if (langPrefix === 'en') {
                return 'en';
            }

            return 'en';
        }

        // 语言名称映射
        const langNames = {
            'zh-CN': '简体中文',
            'zh-TW': '繁體中文',
            'en': 'English',
            'ja': '日本語',
            'ko': '한국어',
            'es': 'Español'
        };

        // 应用翻译
        function applyTranslations(lang) {
            const t = translations[lang];
            if (!t) return;

            document.documentElement.lang = lang;
            document.title = lang === 'zh-CN' ? '下载 LittleAIBox' :
                lang === 'zh-TW' ? '下載 LittleAIBox' :
                    lang === 'en' ? 'Download LittleAIBox' :
                        lang === 'ja' ? 'LittleAIBox をダウンロード' :
                            lang === 'ko' ? 'LittleAIBox 다운로드' :
                                lang === 'es' ? 'Descargar LittleAIBox' :
                                    'Download LittleAIBox';

            // 应用普通文本翻译
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) {
                    el.textContent = t[key];
                }
            });

            // 应用HTML翻译（包含标签）
            document.querySelectorAll('[data-i18n-html]').forEach(el => {
                const key = el.getAttribute('data-i18n-html');
                if (t[key]) {
                    el.innerHTML = t[key];
                }
            });

            // 更新语言选择器显示
            document.getElementById('currentLang').textContent = langNames[lang];

            // 更新选项的active状态
            document.querySelectorAll('.lang-option').forEach(option => {
                if (option.dataset.lang === lang) {
                    option.classList.add('active');
                } else {
                    option.classList.remove('active');
                }
            });

            // 保存语言选择
            localStorage.setItem('downloadPageLanguage', lang);
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            // 优先从URL参数获取语言，其次是localStorage，最后是浏览器检测
            const urlLang = getLangFromURL();
            const savedLang = normalizeLanguage(localStorage.getItem('downloadPageLanguage'));
            const currentLang = urlLang || savedLang || detectBrowserLanguage();

            const urlTheme = getThemeFromURL();
            const savedTheme = normalizeTheme(localStorage.getItem('downloadPageTheme'));
            const currentTheme = urlTheme || savedTheme || 'light';

            const themeToggleButton = document.getElementById('themeToggleButton');
            function applyTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('downloadPageTheme', theme);
                themeToggleButton.setAttribute('aria-label', theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
            }

            applyTheme(currentTheme);
            // 应用翻译
            applyTranslations(currentLang);

            // 语言下拉菜单交互
            const langButton = document.getElementById('langButton');
            const langDropdown = document.getElementById('langDropdown');
            const langMenu = document.getElementById('langMenu');

            langButton.addEventListener('click', (e) => {
                e.stopPropagation();
                const isOpen = langDropdown.classList.toggle('open');
                langButton.setAttribute('aria-expanded', isOpen);
            });

            // 点击选项切换语言
            document.querySelectorAll('.lang-option').forEach(option => {
                option.addEventListener('click', () => {
                    const lang = option.dataset.lang;
                    applyTranslations(lang);
                    langDropdown.classList.remove('open');
                    langButton.setAttribute('aria-expanded', 'false');
                });
            });

            // 点击外部关闭菜单
            document.addEventListener('click', () => {
                if (langDropdown.classList.contains('open')) {
                    langDropdown.classList.remove('open');
                    langButton.setAttribute('aria-expanded', 'false');
                }
            });

            themeToggleButton.addEventListener('click', () => {
                const nextTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                applyTheme(nextTheme);
            });

            // 手风琴功能
            document.querySelectorAll('.accordion-item').forEach(item => {
                const trigger = item.querySelector('.accordion-trigger');
                const content = item.querySelector('.accordion-content');
                trigger.addEventListener('click', () => {
                    const isActive = item.classList.toggle('active');
                    content.style.maxHeight = isActive ? content.scrollHeight + 'px' : null;
                });
            });

            // 感谢框功能
            const thankYouModal = document.getElementById('thank-you-modal');
            const modalContent = document.getElementById('modal-content');
            document.querySelectorAll('a[download]').forEach(link => {
                link.addEventListener('click', () => {
                    thankYouModal.classList.remove('hidden');
                    setTimeout(() => {
                        thankYouModal.classList.remove('opacity-0');
                        modalContent.classList.remove('scale-95');
                    }, 10);

                    setTimeout(() => {
                        thankYouModal.classList.add('opacity-0');
                        modalContent.classList.add('scale-95');
                        setTimeout(() => {
                            thankYouModal.classList.add('hidden');
                        }, 300);
                    }, 3500);
                });
            });
        });

        // 全局点击波纹效果
        document.addEventListener('click', function (e) {
            if (e.target.closest('a, button')) return;
            const ripple = document.createElement('span');
            ripple.classList.add('ripple');
            const size = Math.max(window.innerWidth, window.innerHeight) / 10;
            ripple.style.width = ripple.style.height = `${size}px`;
            ripple.style.left = `${e.clientX}px`;
            ripple.style.top = `${e.clientY}px`;
            document.body.appendChild(ripple);
            ripple.addEventListener('animationend', () => ripple.remove());
        });
    </script>
